
name: CI devops

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test-backend:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build backend
        run: mvn -B clean package -DskipTests --file ay-app/pom.xml

      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >
          mvn -B
          org.owasp:dependency-check-maven:13.0.0:check
          -DnvdApiKey="$NVD_API_KEY"
          -DfailBuildOnCVSS=7
          --file ay-app/pom.xml

      - name: SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B clean verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=Dev-Ops-TD-s_docker-tp2
          -Dsonar.organization=dev-ops-td-s
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.token=$SONAR_TOKEN
          -DskipTests
          --file ay-app/pom.xml